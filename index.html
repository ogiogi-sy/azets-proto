ne; width: 28px; height: 28px; border-radius: 50%; background: #1143be; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;\">EH\u003c/span>\u003cspan style=\"flex: 1; display: flex; flex-direction: column; min-width: 0;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Erik Haugen\u003c/strong>\u003cspan style=\"font-size: 13px; color: #595c6a;\">Reviewer · opens Sign-off\u003c/span>\u003c/span>\u003c/a>\u003ca href=\"Flow7-TeamLead.dc.html\" role=\"menuitem\" style=\"display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #2c2e3a; background: transparent;\">\u003cspan aria-hidden=\"true\" style=\"flex: none; width: 28px; height: 28px; border-radius: 50%; background: #7321b7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;\">KA\u003c/span>\u003cspan style=\"flex: 1; display: flex; flex-direction: column; min-width: 0;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Karin Aas\u003c/strong>\u003cspan style=\"font-size: 13px; color: #595c6a;\">Team lead · super user · opens Team\u003c/span>\u003c/span>\u003c/a>\u003ca href=\"Flow9-PilotResults.dc.html\" role=\"menuitem\" style=\"display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #2c2e3a; background: #f8f8f8;\">\u003cspan aria-hidden=\"true\" style=\"flex: none; width: 28px; height: 28px; border-radius: 50%; background: #0c7350; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;\">PO\u003c/span>\u003cspan style=\"flex: 1; display: flex; flex-direction: column; min-width: 0;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Product owner\u003c/strong>\u003cspan style=\"font-size: 13px; color: #595c6a;\">Azets AI CoE · opens Results\u003c/span>\u003c/span>\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"#0c7350\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3.5 9.5l3.5 3.5 7.5-8\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/details>\n\u003c/header>\n\n\u003cmain style=\"flex: 1; padding: 32px 32px 64px; max-width: 1440px; margin: 0 auto; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 32px;\">\n\n\u003csection style=\"display: flex; flex-direction: column; gap: 10px;\">\n\u003cspan style=\"font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #595c6a;\">Pilot · Market 1 · cost accruals · first three closes\u003c/span>\n\u003ch1 style=\"margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; max-width: 960px;\">Consultants spend \u003cspan style=\"color: #0c7350;\">70 % less time\u003c/span> per accrual, and every booking can be traced.\u003c/h1>\n\u003cp style=\"margin: 0; font-size: 17px; line-height: 26px; color: #595c6a; max-width: 760px;\">21 customers, 3 closes, 642 proposals: close 1 in shadow mode, close 2 with a pilot group, close 3 live in review mode. The baseline is what the same consultants measured by hand in weeks 1–6, before the pilot.\u003c/p>\n\u003c/section>\n\n\u003csection aria-label=\"Key measures\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;\">\n\u003csc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"4\">\n\u003cdiv style=\"border-top: 3px solid {{k.edge}}; padding-top: 14px; display: flex; flex-direction: column; gap: 4px;\">\n\u003cspan style=\"font-size: 15px; color: #595c6a;\">{{k.label}}\u003c/span>\n\u003cspan style=\"font-size: 32px; line-height: 40px; font-weight: 700; font-variant-numeric: tabular-nums;\">{{k.now}}\u003c/span>\n\u003cspan style=\"font-size: 15px; line-height: 20px; color: #595c6a;\">{{k.base}}\u003c/span>\n\u003c/div>\n\u003c/sc-for>\n\u003c/section>\n\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch;\">\n\u003csection aria-labelledby=\"dec-h\" style=\"flex: 3 1 520px; min-width: 0; border: 1px solid #dadce2; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px;\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;\">\n\u003ch2 id=\"dec-h\" style=\"margin: 0; font-size: 20px; line-height: 26px; font-weight: 600;\">What consultants did with the proposals\u003c/h2>\n\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #595c6a;\">\u003cspan style=\"display: flex; align-items: center; gap: 6px;\">\u003cspan aria-hidden=\"true\" style=\"width: 10px; height: 10px; border-radius: 2px; background: #26d07c;\">\u003c/span>Accepted\u003c/span>\u003cspan style=\"display: flex; align-items: center; gap: 6px;\">\u003cspan aria-hidden=\"true\" style=\"width: 10px; height: 10px; border-radius: 2px; background: #1143be;\">\u003c/span>Changed\u003c/span>\u003cspan style=\"display: flex; align-items: center; gap: 6px;\">\u003cspan aria-hidden=\"true\" style=\"width: 10px; height: 10px; border-radius: 2px; background: #c34f00;\">\u003c/span>Rejected\u003c/span>\u003c/span>\n\u003c/div>\n\u003csc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"3\">\n\u003cdiv style=\"display: grid; grid-template-columns: 90px minmax(0, 1fr) 90px; gap: 14px; align-items: center;\">\n\u003cspan style=\"font-size: 15px;\">{{m.name}}\u003c/span>\n\u003cdiv role=\"img\" aria-label=\"{{m.label}}\" style=\"display: flex; height: 28px; border-radius: 6px; overflow: hidden; gap: 2px;\">\n\u003cspan style=\"flex: {{m.acc}}; background: #26d07c; color: #2c2e3a; font-size: 13px; font-weight: 700; display: flex; align-items: center; padding-left: 8px;\">\u003cspan>{{m.acc}} %\u003c/span>\u003c/span>\n\u003cspan style=\"flex: {{m.chg}}; background: #1143be; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center; padding-left: 8px;\">\u003cspan>{{m.chg}} %\u003c/span>\u003c/span>\n\u003cspan style=\"flex: {{m.rej}}; background: #c34f00;\">\u003c/span>\n\u003c/div>\n\u003cspan style=\"font-size: 15px; color: #595c6a; text-align: right;\">{{m.n}} proposals\u003c/span>\n\u003c/div>\n\u003c/sc-for>\n\u003cspan style=\"font-size: 15px; line-height: 20px; color: #595c6a;\">Changes fall as consultants turn their fixes into rules: 34 customer rules added since close 1.\u003c/span>\n\u003c/section>\n\n\u003csection aria-labelledby=\"tr-h\" style=\"flex: 2 1 340px; min-width: 0; border: 1px solid #dadce2; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;\">\n\u003ch2 id=\"tr-h\" style=\"margin: 0; font-size: 20px; line-height: 26px; font-weight: 600;\">How much the agents may do alone\u003c/h2>\n\u003cspan style=\"font-size: 15px; color: #595c6a;\">Customers by trust level, set per customer and approved by the process owner\u003c/span>\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 12px; font-size: 15px;\">\n\u003cdiv style=\"display: grid; grid-template-columns: minmax(0, 1fr) 140px 32px; gap: 12px; align-items: center;\">\u003cspan>Ask me every time\u003c/span>\u003cspan style=\"height: 8px; background: #ececf0; border-radius: 999px; overflow: hidden;\">\u003cspan style=\"display: block; height: 100%; width: 100%; background: #2c2e3a;\">\u003c/span>\u003c/span>\u003cstrong style=\"text-align: right; font-weight: 600;\">21\u003c/strong>\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: minmax(0, 1fr) 140px 32px; gap: 12px; align-items: center;\">\u003cspan>Auto-approve routine items\u003c/span>\u003cspan style=\"height: 8px; background: #ececf0; border-radius: 999px; overflow: hidden;\">\u003cspan style=\"display: block; height: 100%; width: 0%; background: #2c2e3a;\">\u003c/span>\u003c/span>\u003cstrong style=\"text-align: right; font-weight: 600;\">0\u003c/strong>\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: minmax(0, 1fr) 140px 32px; gap: 12px; align-items: center;\">\u003cspan>Auto-approve unless flagged\u003c/span>\u003cspan style=\"height: 8px; background: #ececf0; border-radius: 999px; overflow: hidden;\">\u003cspan style=\"display: block; height: 100%; width: 0%; background: #2c2e3a;\">\u003c/span>\u003c/span>\u003cstrong style=\"text-align: right; font-weight: 600;\">0\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cspan style=\"font-size: 15px; line-height: 20px; color: #595c6a;\">Auto-approve stays off in the first increment. It opens per customer only after a risk assessment and the process owner’s approval.\u003c/span>\n\u003c/section>\n\u003c/div>\n\n\u003csection aria-labelledby=\"next-h\" style=\"background: #f8f8f8; border-radius: 12px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-start;\">\n\u003cdiv style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px;\">\n\u003ch2 id=\"next-h\" style=\"margin: 0; font-size: 20px; line-height: 26px; font-weight: 600;\">Same screens, next scenario\u003c/h2>\n\u003cp style=\"margin: 0; font-size: 15px; line-height: 24px; color: #424553;\">Each new scenario adds one reasoning agent behind the same review, rules and trail. Consultants keep the screens they already know.\u003c/p>\n\u003c/div>\n\u003col style=\"flex: 2 1 480px; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;\">\n\u003cli style=\"display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #26d07c; padding-top: 10px;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Cost accruals\u003c/strong>\u003cspan style=\"font-size: 15px; color: #0c7350; font-weight: 600;\">Pilot now\u003c/span>\u003c/li>\n\u003cli style=\"display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #1143be; padding-top: 10px;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Revenue accruals\u003c/strong>\u003cspan style=\"font-size: 15px; color: #595c6a;\">Next\u003c/span>\u003c/li>\n\u003cli style=\"display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #c5c9d3; padding-top: 10px;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Manual journals\u003c/strong>\u003cspan style=\"font-size: 15px; color: #595c6a;\">Then\u003c/span>\u003c/li>\n\u003cli style=\"display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #c5c9d3; padding-top: 10px;\">\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Valuation adjustments\u003c/strong>\u003cspan style=\"font-size: 15px; color: #595c6a;\">Later, more judgement\u003c/span>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1350}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const kpis = [\n      { label: 'Minutes per accrual', now: '2,8', base: 'Baseline 9,5 · −70 %', edge: '#26d07c' },\n      { label: 'Accepted without a change', now: '70 %', base: 'Up from 58 % in close 1', edge: '#26d07c' },\n      { label: 'Exceptions solved before close', now: '96 %', base: 'Baseline not tracked', edge: '#1143be' },\n      { label: 'Bookings with a full trail', now: '100 %', base: 'Baseline: about 40 % had a note', edge: '#1143be' }\n    ];\n    const m = (name, acc, chg, rej, n) => ({ name, acc, chg, rej, n, label: name + ': ' + acc + ' % accepted, ' + chg + ' % changed, ' + rej + ' % rejected' });\n    const months = [m('Close 1', 58, 30, 12, 198), m('Close 2', 63, 28, 9, 214), m('Close 3', 70, 24, 6, 230)];\n    return { kpis, months };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}];

const PEOPLE = {
  karin: { name: 'Karin Aas', role: 'Team lead and super user', initials: 'KA', color: '#7321b7' },
  kari: { name: 'Kari Nilsen', role: 'Consultant', initials: 'KN', color: '#112034' },
  erik: { name: 'Erik Haugen', role: 'Reviewer', initials: 'EH', color: '#1143be' }
};
const STEPS = [
  { title: 'Set up the client', who: 'karin', text: 'Azets takes on a new client, Fjordline Bakeri. Karin starts from a similar client, then connects its ERP and invites the people who will work on it.' },
  { title: 'Connect the sources', who: 'karin', text: 'Karin chooses how Fjordline sends its documents. She checks the agent’s first readings and turns her corrections into rules before the client goes live.' },
  { title: 'Consultant workbench', who: 'kari', text: 'Monday 2 November, the October close. The agents read the customers’ material overnight. Kari starts her day with an email that tells her who needs her.' },
  { title: 'Proposal and approval', who: 'kari', text: 'Kari works through the agent’s proposals for Brattli Rørservice, exceptions first. She approves, corrects a figure, and teaches the agent so the correction sticks.' },
  { title: 'Post to the ERP', who: 'erik', text: 'Erik signs off the batch. The bookings go to Brattli’s ERP, every voucher is confirmed back, and each number can be traced to its source.' }
];

// Clicks on links inside a screen go to the shell instead of a file
const INTERCEPT = '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var m=(a.getAttribute("href")||"").match(/^([\\w-]+)\\.dc\\.html$/);if(!m)return;e.preventDefault();parent.postMessage({azetsProto:m[1]},"*");},true);<\/script>';

// The walk-through: a transition screen before each step, the screens, an end screen, then the extra roles
const ITEMS = [];
STEPS.forEach((st, i) => {
  ITEMS.push({ id: 'step-' + (i + 1), kind: 'chapter', step: i + 1, title: st.title });
  SCREENS.filter((s) => s.step === i + 1).forEach((s) => ITEMS.push({ ...s, kind: 'screen' }));
});
ITEMS.push({ id: 'end', kind: 'end', step: 6, title: 'End of the flow' });
SCREENS.filter((s) => !s.step).forEach((s) => ITEMS.push({ ...s, kind: 'screen' }));

const byId = Object.fromEntries(ITEMS.map((s) => [s.id, s]));
const FLOW = SCREENS.filter((s) => s.step).map((s) => s.id);
const START = 'step-1';

const chapter = document.getElementById('chapter');
const frame = document.getElementById('frame');
const iframe = document.getElementById('screen');
const menu = document.getElementById('menu');
const dock = document.getElementById('dock');
const menuBtn = document.getElementById('menuBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function current() {
  const id = decodeURIComponent(location.hash.slice(1));
  return byId[id] ? id : START;
}

function go(id, fromScreen) {
  const t = byId[id];
  if (!t) return;
  // A link that jumps forward into a new step shows that step's transition screen first
  const from = byId[current()];
  if (fromScreen && t.kind === 'screen' && t.step && from.step && t.step > from.step && FLOW.find((f) => byId[f].step === t.step) === id) id = 'step-' + t.step;
  if (current() === id && location.hash) render(id);
  else location.hash = id;
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function stepBar(active) {
  return '<ol class="steps" aria-label="The five steps">' + STEPS.map((st, i) => {
    const n = i + 1;
    const cls = n < active ? 'done' : n === active ? 'now' : '';
    return '<li class="' + cls + '"' + (n === active ? ' aria-current="step"' : '') + '><i class="bar"></i><span>' + n + ' · ' + esc(st.title) + '</span></li>';
  }).join('') + '</ol>';
}

function chapterHtml(item) {
  const top = '<div class="ch-top"><img src="' + LOGO + '" alt="Azets"><span class="chip">Prototype · invented demo data</span></div>';
  const context = '<p class="ch-context">Clickable prototype · AI-assisted processing of customer accounting material</p>';
  if (item.kind === 'end') {
    return top + '<div class="ch-body"><div class="ch-col">' + context + stepBar(6) +
      '<div class="ch-text"><span>End of the flow</span><h1>From a new client to a confirmed posting</h1>' +
      '<p>That’s the whole flow. Two more views show the same close from other roles.</p></div>' +
      '<div class="more"><button type="button" data-go="Flow7-TeamLead"><strong>Team lead view</strong>Karin sees progress by consultant and approves new rules.</button>' +
      '<button type="button" data-go="Flow9-PilotResults"><strong>Pilot results</strong>How the pilot performs, for the Azets AI CoE.</button></div>' +
      '<div class="go"><button type="button" class="ghost" data-go="step-1">Start again</button></div></div></div>';
  }
  const st = STEPS[item.step - 1];
  const p = PEOPLE[st.who];
  const inside = SCREENS.filter((s) => s.step === item.step).map((s) => '<li>' + esc(s.title) + '</li>').join('');
  const first = FLOW.find((f) => byId[f].step === item.step);
  return top + '<div class="ch-body"><div class="ch-col">' + context + stepBar(item.step) +
    '<div class="ch-text"><span>Step ' + item.step + ' of 5</span><h1>' + esc(st.title) + '</h1><p>' + esc(st.text) + '</p></div>' +
    '<div class="who"><span class="av" aria-hidden="true" style="background:' + p.color + '">' + p.initials + '</span><span>You’re watching <strong>' + esc(p.name) + '</strong><small>' + esc(p.role) + '</small></span></div>' +
    '<ul class="inside"><li><span class="lbl">In this step:</span></li>' + inside + '</ul>' +
    '<div class="go"><button type="button" data-go="' + first + '">' + (item.step === 1 ? 'Start' : 'Continue') + ' →</button><span class="hint">Then click through the screens, or use › at the bottom left</span></div>' +
    '</div></div>';
}

function render(id) {
  const item = byId[id];
  if (item.kind === 'screen') {
    chapter.hidden = true;
    frame.hidden = false;
    iframe.style.opacity = '0';
    iframe.srcdoc = item.html
      .replace('<script src="./support.js"><\/script>', '<script src="' + RUNTIME + '"><\/script>')
      .split('%%LOGO%%').join(LOGO)
      .replace('</body>', INTERCEPT + '</body>');
  } else {
    frame.hidden = true;
    iframe.srcdoc = '';
    chapter.innerHTML = chapterHtml(item);
    chapter.hidden = false;
    chapter.scrollTop = 0;
    const main = chapter.querySelector('.go button');
    if (main) main.focus({ preventScroll: true });
  }
  document.title = item.title + ' · Azets prototype';
  iframe.title = item.title;

  const i = FLOW.indexOf(id);
  document.getElementById('count').textContent = item.kind === 'chapter' ? 'Step ' + item.step + ' of 5' : item.kind === 'end' ? 'End' : i >= 0 ? (i + 1) + ' of ' + FLOW.length : 'Extra';
  document.getElementById('name').textContent = item.kind === 'chapter' ? item.title : item.kind === 'screen' ? item.title : '';
  dock.classList.toggle('compact', item.kind === 'screen');
  const k = ITEMS.indexOf(item);
  prevBtn.disabled = k <= 0;
  nextBtn.disabled = k >= ITEMS.length - 1;
  buildMenu(id);
  closeMenu();
}

iframe.addEventListener('load', () => {
  iframe.style.opacity = '1';
  if (!frame.hidden) { try { iframe.contentWindow.focus(); } catch (e) {} }
});

function step(d) {
  const k = ITEMS.indexOf(byId[current()]) + d;
  if (k >= 0 && k < ITEMS.length) go(ITEMS[k].id);
}

function buildMenu(active) {
  let html = '';
  STEPS.forEach((st, i) => {
    html += '<h2>' + (i + 1) + ' · ' + esc(st.title) + '</h2><ul>';
    SCREENS.filter((s) => s.step === i + 1).forEach((s) => {
      html += '<li><button type="button" data-id="' + s.id + '"' + (s.id === active ? ' aria-current="page"' : '') + '><span class="n">' + (FLOW.indexOf(s.id) + 1) + '</span>' + esc(s.title) + '</button></li>';
    });
    html += '</ul>';
  });
  html += '<h2>Other roles</h2><ul>';
  SCREENS.filter((s) => !s.step).forEach((s) => {
    html += '<li><button type="button" data-id="' + s.id + '"' + (s.id === active ? ' aria-current="page"' : '') + '><span class="n"></span>' + esc(s.title) + '</button></li>';
  });
  html += '</ul><p class="foot">Prototype for discussion. All customers, people and figures are invented.</p>';
  menu.innerHTML = html;
}

function openMenu() { menu.hidden = false; dock.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true'); const a = menu.querySelector('[aria-current]'); (a || menu.querySelector('button')).focus(); }
function closeMenu() { menu.hidden = true; dock.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }

menuBtn.addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu()));
menu.addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) go(b.dataset.id); });
chapter.addEventListener('click', (e) => { const b = e.target.closest('button[data-go]'); if (b) go(b.dataset.go); });
document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !menu.hidden) { closeMenu(); menuBtn.focus(); return; }
  if (!menu.hidden || e.altKey || e.metaKey || e.ctrlKey) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
prevBtn.addEventListener('click', () => step(-1));
nextBtn.addEventListener('click', () => step(1));
window.addEventListener('message', (e) => { if (e.source === iframe.contentWindow && e.data && e.data.azetsProto) go(e.data.azetsProto, true); });
window.addEventListener('hashchange', () => render(current()));
render(current());
</script>
