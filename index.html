<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Azets period-end accruals · clickable prototype</title>
<style>
:root{--navy:#112034;--green:#26d07c;--green-ink:#0c7350;--ink:#2c2e3a;--muted:#595c6a;--line:#dadce2;--hair:#ececf0;--soft:#c5c9d3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #1143be;outline-offset:2px}

#frame{position:fixed;inset:0}
#frame[hidden]{display:none}
#screen{display:block;width:100%;height:100%;border:0;background:#ffffff}
@media (prefers-reduced-motion: no-preference){#screen{transition:opacity .12s ease}}

/* Step transition screens */
#chapter{position:fixed;inset:0;overflow:auto;background:#ffffff;display:flex;flex-direction:column}
#chapter[hidden]{display:none}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px;border-bottom:1px solid var(--hair)}
.ch-top img{height:20px;width:auto;display:block}
.ch-top .chip{font-size:13px;font-weight:600;color:#424553;background:var(--hair);border-radius:999px;padding:4px 12px;white-space:nowrap}
.ch-body{flex:1;display:flex;justify-content:center;align-items:safe center;padding:48px 24px 96px}
.ch-col{width:100%;max-width:880px;display:flex;flex-direction:column;gap:28px}
.ch-context{margin:0;font-size:15px;line-height:20px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.steps li{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:18px;color:var(--muted)}
.steps .bar{height:4px;border-radius:999px;background:var(--hair)}
.steps .done .bar{background:var(--green)}
.steps .now .bar{background:var(--green)}
.steps .now{color:var(--ink);font-weight:700}
.steps .done{color:var(--ink)}
.ch-text{display:flex;flex-direction:column;gap:14px}
.ch-text span{font-size:13px;line-height:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--green-ink)}
.ch-text h1{margin:0;font-size:48px;line-height:1.1;font-weight:700}
.ch-text p{margin:0;font-size:21px;line-height:1.45;color:var(--muted);max-width:720px}
.who{display:flex;align-items:center;gap:12px;font-size:16px;line-height:22px}
.who .av{flex:none;width:40px;height:40px;border-radius:50%;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.who small{display:block;font-size:14px;color:var(--muted)}
.inside{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;padding:0;list-style:none;font-size:15px;line-height:20px}
.inside li{display:flex;align-items:center;gap:8px}
.inside li+li::before{content:"→";color:var(--soft)}
.inside li:nth-child(2)::before{content:none}
.inside .lbl{color:var(--muted);margin-right:4px}
.go{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-top:4px}
.go button{border:0;background:var(--green);color:var(--ink);border-radius:999px;padding:15px 30px;font-size:16px;font-weight:700}
.go button:hover{background:#4fdb95}
.go .hint{font-size:14px;color:var(--muted)}
.go .ghost{background:#ffffff;border:1px solid var(--soft);font-weight:600}
.go .ghost:hover{background:#f3f4f6}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.more button{text-align:left;background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:21px;color:var(--muted)}
.more button:hover{border-color:var(--ink)}
.more strong{font-size:17px;color:var(--ink);font-weight:600}
@media (max-width:640px){.ch-text h1{font-size:34px}.ch-text p{font-size:18px}.steps li span{display:none}.ch-top{padding:16px}}

/* Navigator */
#dock{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;align-items:center;gap:2px;padding:3px;background:var(--navy);color:#ffffff;border-radius:999px;box-shadow:0 8px 24px rgba(17,32,52,0.28);font-size:14px;line-height:18px}
#dock button{border:0;background:transparent;color:#ffffff;border-radius:999px;height:36px;display:inline-flex;align-items:center;gap:8px}
#dock button:hover{background:rgba(255,255,255,0.12)}
#dock button:disabled{opacity:0.35;cursor:default;background:transparent}
#dock .arrow{width:36px;justify-content:center;font-size:18px}
#dock #nextBtn{background:var(--green);color:var(--ink);font-weight:700}
#dock #nextBtn:hover{background:#4fdb95}
#dock #nextBtn:disabled{background:transparent;color:#ffffff}
#dock #menuBtn{padding:0 12px;font-weight:600;max-width:min(420px, calc(100vw - 140px))}
#dock #menuBtn .count{color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums;flex:none}
#dock #menuBtn .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock.compact:not(.open):not(:hover):not(:focus-within) .name{display:none}
#menu{position:fixed;left:12px;bottom:60px;z-index:11;width:340px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);overflow:auto;background:#ffffff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(44,46,58,0.18);padding:8px}
#menu[hidden]{display:none}
#menu h2{margin:0;padding:10px 12px 4px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
#menu ul{margin:0;padding:0;list-style:none}
#menu button{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:15px;line-height:20px;color:var(--ink)}
#menu button:hover{background:#f3f4f6}
#menu button[aria-current="page"]{background:#e9fcf1;font-weight:600}
#menu .n{width:22px;flex:none;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#menu .foot{margin:6px 4px 2px;padding:10px 8px 4px;border-top:1px solid var(--hair);font-size:13px;line-height:18px;color:var(--muted)}
</style>
</head>
<body>

  <button type="button" class="arrow" id="prevBtn" aria-label="Previous">‹</button>
  <button type="button" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span class="count" id="count"></span><span class="name" id="name"></span></button>
  <button type="button" class="arrow" id="nextBtn" aria-label="Next">›</button>
</nav>
<div id="menu" hidden></div>

c/dd>\n\u003cdt style=\"color: #595c6a;\">Live by\u003c/dt>\u003cdd style=\"margin: 0;\">November close\u003c/dd>\n\u003c/dl>\n\u003c/section>\n\u003c/aside>\n\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1680}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { start: 'bb', erp: false, output: 'file', summary: true, mapped: {}, ole: false, dpa: true };\n  }\n  renderVals() {\n    const st = this.state;\n    const startDefs = [\n      { id: 'bb', name: 'Bergen Bakehus AS', sub: 'Bakery · ERP A', rec: true },\n      { id: 'br', name: 'Brattli Rørservice AS', sub: 'Plumbing · ERP A', rec: false },\n      { id: 'none', name: 'Start empty', sub: 'Learn from the replay only', rec: false }\n    ];\n    const starts = startDefs.map((s) => ({\n      ...s, on: st.start === s.id,\n      edge: st.start === s.id ? '2px solid #0c7350' : '1px solid #dadce2',\n      bg: st.start === s.id ? '#ffffff' : '#ffffff',\n      pick: () => this.setState({ start: s.id })\n    }));\n    const copyLines = {\n      bb: 'Copies from Bergen Bakehus: 42 accounts · 9 rules for Karin to approve · document types · close calendar',\n      br: 'Copies from Brattli Rørservice: 31 accounts · 14 rules for Karin to approve · close calendar',\n      none: 'Nothing copied. Group and global rules still apply.'\n    };\n    const outDefs = [\n      { id: 'file', name: 'Journal file for import', sub: 'Pilot · the reviewer imports it', off: false },\n      { id: 'post', name: 'Post straight to the Customer ERP', sub: 'After a risk assessment', off: true }\n    ];\n    const outputs = outDefs.map((o) => ({\n      ...o, on: st.output === o.id,\n      edge: st.output === o.id ? '2px solid #0c7350' : '1px solid #dadce2',\n      bg: o.off ? '#f8f8f8' : '#ffffff', ink: o.off ? '#595c6a' : '#2c2e3a', cursor: o.off ? 'not-allowed' : 'pointer',\n      pick: () => this.setState({ output: o.id })\n    }));\n    const mapDefs = [\n      { id: 'flour', what: 'Flour and dairy deliveries', acct: '4010 Raw materials', why: 'Bergen Bakehus books the same deliveries here' },\n      { id: 'energy', what: 'Electricity and gas', acct: '6200 Electricity', why: 'Name and 12 months of history match' },\n      { id: 'rent', what: 'Bakery premises rent', acct: '6300 Rent of premises', why: 'Name matches, no history yet' }\n    ];\n    const mapRows = mapDefs.map((m) => ({ ...m, done: !!st.mapped[m.id], open: !st.mapped[m.id], confirm: () => this.setState({ mapped: { ...st.mapped, [m.id]: true } }) }));\n    const mapLeft = mapDefs.filter((m) => !st.mapped[m.id]).length;\n    const checks = [\n      { label: 'Client details', state: 'Done', ok: true },\n      { label: 'Starting point', state: st.start === 'none' ? 'Empty' : 'Chosen', ok: true },\n      { label: 'Account mapping', state: mapLeft ? mapLeft + ' to confirm' : 'Confirmed', ok: !mapLeft },\n      { label: 'Customer ERP', state: st.erp ? 'Connected' : 'To test', ok: st.erp },\n      { label: 'Data agreement', state: st.dpa ? 'Signed' : 'Missing', ok: st.dpa },\n      { label: 'People and access', state: st.ole ? 'All invited' : '1 to invite', ok: st.ole },\n      { label: 'Agents', state: 'Review everything', ok: true },\n      { label: 'After sign-off', state: 'Journal file', ok: true },\n      { label: 'Sources', state: 'Next step', ok: false }\n    ].map((k) => ({ ...k, dot: k.ok ? '#0c7350' : '#c5c9d3' }));\n    return {\n      starts, copyLine: copyLines[st.start], outputs, checks,\n      erpOpen: !st.erp, erpDone: st.erp,\n      erpTitle: st.erp ? 'Connected · read access' : 'Ready to connect',\n      erpSub: st.erp ? '312 accounts and 12 months imported' : 'Service account approved by Ingrid, 28 Oct',\n      testErp: () => this.setState({ erp: true }),\n      summary: st.summary, toggleSummary: () => this.setState({ summary: !st.summary }),\n      mapRows, mapSummary: mapLeft ? '42 matched · ' + mapLeft + ' to confirm' : 'All 45 confirmed',\n      oleOpen: !st.ole, oleInvited: st.ole, inviteOle: () => this.setState({ ole: true }),\n      dpa: st.dpa, toggleDpa: () => this.setState({ dpa: !st.dpa })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Setup3-Sources", "title": "Connect the sources", "step": 2, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Connect the sources\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton{cursor:pointer;font-family:inherit}\nbutton:disabled{cursor:not-allowed}\na:focus-visible,button:focus-visible{outline:2px solid #1143be;outline-offset:2px}\nsummary::-webkit-details-marker{display:none}\nsummary::marker{content:\"\"}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"display: flex; flex-direction: column; min-height: 100vh;\">\n\n\n\u003cheader style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 32px; border-bottom: 1px solid #ececf0;\">\n\u003ca href=\"Setup1-Clients.dc.html\" aria-label=\"Azets, Clients\" style=\"display: flex;\">\u003cimg src=\"%%LOGO%%\" alt=\"Azets\" style=\"height: 20px; width: auto;\">\u003c/a>\n\u003cnav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 4px;\">\n\u003ca href=\"Flow7-TeamLead.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: #2c2e3a; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: transparent;\">Team\u003c/a>\n\u003ca href=\"Setup1-Clients.dc.html\" aria-current=\"page\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #2c2e3a; text-de -dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1500}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { upload: true, mailbox: true, uploaded: false, asked: false };\n  }\n  renderVals() {\n    const st = this.state;\n    const on = ['On', '#e9fcf1', '#0c7350'];\n    const off = ['Off', '#ececf0', '#424553'];\n    const later = ['Later', '#ececf0', '#424553'];\n    const sources = [\n      { id: 'upload', mono: 'UP', name: 'Portal upload', sub: 'Customer drags files in', tag: st.upload ? on : off, canToggle: true, isOn: st.upload },\n      { id: 'mailbox', mono: '@', name: 'Forwarding mailbox', sub: 'Forward to a Fjordline-only address', tag: st.mailbox ? on : off, canToggle: true, isOn: st.mailbox, showMail: st.mailbox },\n      { id: 'bank', mono: 'BK', name: 'Bank feed', sub: 'Via the Customer ERP, 1 account', tag: on, canToggle: false, fixedText: '' },\n      { id: 'folder', mono: 'SP', name: 'SharePoint or shared folder', sub: 'Files from a shared folder', tag: later, canToggle: false, fixedText: '' },\n      { id: 'addin', mono: 'OL', name: 'Outlook add-in', sub: 'Send an email from Outlook', tag: later, canToggle: false, fixedText: '' }\n    ].map((s) => ({\n      ...s, status: s.tag[0], tagBg: s.tag[1], tagInk: s.tag[2], fixed: !s.canToggle, showMail: !!s.showMail,\n      btn: s.isOn ? 'Turn off' : 'Turn on', pressed: s.isOn ? 'true' : 'false',\n      btnBg: s.isOn ? '#ffffff' : '#26d07c', btnEdge: s.isOn ? '1px solid #c5c9d3' : '1px solid #26d07c',\n      toggle: () => this.setState({ [s.id]: !st[s.id] })\n    }));\n    const onCount = (st.upload ? 1 : 0) + (st.mailbox ? 1 : 0) + 1;\n    const clean = ['Clean', '#e9fcf1', '#0c7350'];\n    const blocked = ['Blocked · macros', '#fdeadd', '#2c2e3a'];\n    const held = ['Held', '#fff3d3', '#2c2e3a'];\n    const base = [\n      { time: '09:12', file: 'Mølleriet faktura oktober.pdf', from: 'Ingrid Fjordli', via: 'Upload', c: clean, kind: 'Supplier invoice' },\n      { time: '09:12', file: 'Tine levering uke 43.pdf', from: 'Ingrid Fjordli', via: 'Upload', c: clean, kind: 'Delivery note' },\n      { time: '08:47', file: 'Strøm september.pdf', from: 'Ole Vik', via: 'Upload', c: clean, kind: 'Energy bill' },\n      { time: '08:30', file: 'Price list 2026.xlsm', from: 'Ole Vik', via: 'Upload', c: blocked, kind: 'Not stored' },\n      { time: '07:55', file: 'Tilbud bakeriutstyr.pdf', from: 'Unknown sender', via: 'Mailbox', c: held, kind: 'Amir checks it first' }\n    ];\n    const added = [\n      { time: '10:04', file: 'Kortutskrift oktober.pdf', from: 'Ingrid Fjordli', via: 'Upload', c: clean, kind: 'Card statement', fresh: true },\n      { time: '10:04', file: 'Husleie november.pdf', from: 'Ingrid Fjordli', via: 'Upload', c: clean, kind: 'Rent invoice', fresh: true }\n    ];\n    const log = (st.uploaded ? added.concat(base) : base).map((l) => ({ ...l, check: l.c[0], tagBg: l.c[1], tagInk: l.c[2], rowBg: l.fresh ? '#f8f8f8' : 'transparent' }));\n    const green = '#0c7350', grey = '#c5c9d3';\n    const expected = [\n      { name: 'Supplier invoices', state: 'Received', dot: green },\n      { name: 'Delivery notes', state: 'Received', dot: green },\n      { name: 'Energy bills', state: 'Received', dot: green },\n      { name: 'Card statements', state: st.uploaded ? 'Received' : 'Not yet', dot: st.uploaded ? green : grey },\n      { name: 'Rent', state: st.uploaded ? 'Received' : 'Not yet', dot: st.uploaded ? green : grey }\n    ];\n    return {\n      sources, onCount, log, expected,\n      canDemo: !st.uploaded, demoUpload: () => this.setState({ uploaded: true }),\n      askOpen: !st.asked, asked: st.asked, ask: () => this.setState({ asked: true })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow8-TrainCustomer", "title": "Train a new customer", "step": 2, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Train a new cust x; font-weight: 700;\">Fjordline is live from the November close · {{rulesActive}}\u003c/strong>\n\u003c/span>\n\u003ca href=\"Flow0-Email.dc.html\" style=\"background: #26d07c; color: #2c2e3a; text-decoration: none; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 700;\">See a monthly close\u003c/a>\n\u003c/div>\n\u003c/sc-if>\n\u003cspan role=\"status\" style=\"font-size: 15px; line-height: 20px; color: {{hintInk}}; font-weight: {{hintWeight}}; max-width: 420px;\">{{nextHint}}\u003c/span>\n\u003c/div>\n\u003c/div>\n\n\u003caside style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n\u003csection aria-labelledby=\"own-h\" style=\"border: 1px solid #dadce2; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;\">\n\u003cstrong id=\"own-h\" style=\"font-size: 15px; font-weight: 600;\">Who and how long\u003c/strong>\n\u003cdl style=\"margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 15px; line-height: 21px;\">\n\u003cdt style=\"color: #595c6a;\">Owner\u003c/dt>\u003cdd style=\"margin: 0;\">Amir Haddad, consultant\u003c/dd>\n\u003cdt style=\"color: #595c6a;\">Super user\u003c/dt>\u003cdd style=\"margin: 0;\">Karin Aas\u003c/dd>\n\u003cdt style=\"color: #595c6a;\">Estimate\u003c/dt>\u003cdd style=\"margin: 0;\">3 h · 1 h 40 used\u003c/dd>\n\u003cdt style=\"color: #595c6a;\">Live by\u003c/dt>\u003cdd style=\"margin: 0;\">November close\u003c/dd>\n\u003c/dl>\n\u003cdiv style=\"height: 6px; background: #ececf0; border-radius: 999px; overflow: hidden;\">\u003cspan style=\"display: block; height: 100%; width: 55%; background: #1143be;\">\u003c/span>\u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"src-h\" style=\"border: 1px solid #dadce2; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;\">\n\u003cstrong id=\"src-h\" style=\"font-size: 15px; font-weight: 600;\">Connected\u003c/strong>\n\u003cul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 21px;\">\n\u003cli style=\"display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: #0c7350; font-weight: 700;\">✓\u003c/span>\u003cspan>Customer inbox, 2 senders\u003c/span>\u003c/li>\n\u003cli style=\"display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: #0c7350; font-weight: 700;\">✓\u003c/span>\u003cspan>Bank feed, 1 account\u003c/span>\u003c/li>\n\u003cli style=\"display: flex; gap: 10px;\">\u003cspan aria-hidden=\"true\" style=\"color: #0c7350; font-weight: 700;\">✓\u003c/span>\u003cspan>Customer ERP · chart of accounts and 12 months\u003c/span>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003c/aside>\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1650}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { handled: {}, drafts: {}, ruleText: {}, answers: {}, chatDraft: {}, unclear: {}, replayed: false, live: false };\n  }\n  renderVals() {\n    const st = this.state;\n    const types = {\n      proc: { label: 'Processing rule · how the agent reads', short: 'Processing', bg: '#ebfaff', ink: '#00465c' },\n      ana: { label: 'Analysis rule · how the agent decides', short: 'Analysis', bg: '#f7f2ff', ink: '#60138a' }\n    };\n    const defs = [\n      { id: 'ocr', stage: 1, type: 'proc', title: 'Ingredients invoices · Bakeriråvarer Vest', diff: 'Read “Å betale” (incl. VAT), not “Sum eks. mva.” · 4 invoices', count: 4, rule: 'Bakeriråvarer Vest invoices: the amount is “Sum eks. mva.”, not “Å betale”', ask: 'I read “Å betale”, which includes VAT. Which amount should I use for Bakeriråvarer Vest?', reply: 'Always use “Sum eks. mva.”' },\n      { id: 'rent', stage: 2, type: 'ana', title: 'Shop rent · Kystgården Eiendom', diff: 'Accrued monthly, but rent is prepaid quarterly · 2 months', count: 2, rule: 'Do not accrue rent for Kystgården; it is prepaid quarterly', ask: 'I accrued Kystgården’s rent every month. How is it paid?', reply: 'Quarterly in advance, so don’t accrue it' }\n    ];\n    const ruleState = st.live ? ['Active', '#e9fcf1', '#0c7350'] : (st.replayed ? ['Tested in replay', '#ffffff', '#2c2e3a'] : ['Suggested · not active', '#ffffff', '#595c6a']);\n    const mkRow = (d) => {\n      const h = st.handled[d.id];\n      const ty = types[d.type];\n      const drafting = !h && !!st.drafts[d.id];\n      const text = st.ruleText[d.id] !== undefined ? st.ruleText[d.id] : d.rule;\n      return {\n        ...d,\n        isOpen: !h && !drafting,\n        drafting,\n        suggested: h === 'rule',\n        closed: !!h,\n        fade: h === 'once' ? '0.6' : '1',\n        typeLabel: ty.label,\n        bg: ty.bg,\n        ink: ty.ink,\n        ruleText: text,\n        result: h === 'rule' ? (st.replayed || st.live ? 'Rule · ' + ruleState[0].toLowerCase() : 'Rule suggested · not active') : 'This document only · no rule',\n        resultInk: h === 'rule' ? ty.ink : '#595c6a',\n        setRuleText: (e) => this.setState({ ruleText: { ...st.ruleText, [d.id]: e.target.value } }),\n        answered: drafting && !!st.answers[d.id],\n        hadUnclear: drafting && !!st.unclear[d.id],\n        unclearText: st.unclear[d.id] || '',\n        asking: drafting && !st.answers[d.id],\n        answer: st.answers[d.id] || '',\n        chatDraft: st.chatDraft[d.id] || '',\n        setChatDraft: (e) => this.setState({ chatDraft: { ...st.chatDraft, [d.id]: e.target.value } }),\n        pickReply: () => this.setState({ answers: { ...st.answers, [d.id]: d.reply } }),\n        sendChat: () => {\n          const v = (st.chatDraft[d.id] || '').trim();\n          if (!v) return;\n          // Too short to turn into a rule: the agent asks for more\n          if (v.split(/\\s+/).length \u003c 3) this.setState({ unclear: { ...st.unclear, [d.id]: v }, chatDraft: { ...st.chatDraft, [d.id]: '' } });\n          else this.setState({ answers: { ...st.answers, [d.id]: v } });\n        },\n        cantSend: !(st.chatDraft[d.id] || '').trim(),\n        sendOpacity: (st.chatDraft[d.id] || '').trim() ? '1' : '0.45',\n        draft: () => this.setState({ drafts: { ...st.drafts, [d.id]: true } }),\n        cancel: () => { const n = { ...st.drafts }; delete n[d.id]; const a = { ...st.answers }; delete a[d.id]; const u = { ...st.unclear }; delete u[d.id]; this.setState({ drafts: n, answers: a, unclear: u }); },\n        suggest: () => this.setState({ handled: { ...st.handled, [d.id]: 'rule' } }),\n        once: () => this.setState({ handled: { ...st.handled, [d.id]: 'once' } })\n      };\n    };\n    const stage1 = defs.filter((d) => d.stage === 1);\n    const stage2 = defs.filter((d) => d.stage === 2);\n    const left1 = stage1.filter((d) => !st.handled[d.id]).length;\n    const left2 = stage2.filter((d) => !st.handled[d.id]).length;\n    const readDone = left1 === 0;\n    const stages = [\n      { n: '1', hid: 'st1-h', title: 'What the agent read', who: 'Processing rules', status: readDone ? 'Checked' : left1 + ' to check', badgeBg: '#ebfaff', badgeInk: '#00465c', locked: false, open: true, fade: '1', rows: stage1.map(mkRow) },\n      { n: '2', hid: 'st2-h', title: 'What the agent concluded', who: 'Analysis rules', status: readDone ? (left2 ? left2 + ' to check' : 'Checked') : 'After step 1', badgeBg: '#f7f2ff', badgeInk: '#60138a', locked: !readDone, open: readDone, fade: readDone ? '1' : '0.55', rows: stage2.map(mkRow) }\n    ];\n    const handledCount = Object.keys(st.handled).length;\n    const ruleIds = defs.filter((d) => st.handled[d.id] === 'rule');\n    const rulesMade = ruleIds.length;\n    const acc = st.replayed ? (rulesMade === defs.length ? 96 : 92) : 77;\n    const openDefs = defs.filter((d) => !st.handled[d.id]);\n    const drafting = defs.some((d) => st.drafts[d.id] && !st.handled[d.id]);\n    const stepDefs = [\n      { label: 'Set up the client', href: 'Setup2-ClientSetup.dc.html' },\n      { label: 'Connect the sources', href: 'Setup3-Sources.dc.html' },\n      { label: 'Replay the last three closes', href: '' },\n      { label: 'Go live in review mode', href: '' }\n    ];\n    const current = st.live ? 4 : 2;\n    const steps = stepDefs.map((d, i) => {\n      const done = i \u003c current;\n      const on = i === current;\n      const next = i === current + 1;\n      const tag = done ? 'Done' : (on ? 'Now' : (next ? 'Next' : 'Later'));\n      const isLink = done && !!d.href;\n      return { label: d.label, href: d.href, tag, isLink, isText: !isLink, current: on ? 'step' : 'false',\n        bar: done ? '#0c7350' : (on ? '#26d07c' : '#dadce2'), ink: done || on ? '#0c7350' : '#595c6a', textInk: i > current ? '#595c6a' : '#2c2e3a' };\n    });\n    const ready = st.replayed && acc >= 90;\n    return {\n      steps,\n      stages,\n      matched: Math.round(26 * acc / 100),\n      rulesActive: !rulesMade ? 'no new rules' : rulesMade === 1 ? '1 rule active' : rulesMade + ' rules active',\n      openCount: openDefs.reduce((n, d) => n + d.count, 0),\n      openLabel: openDefs.length ? 'Mismatches, ' + openDefs.length + (openDefs.length === 1 ? ' cause' : ' causes') : 'Mismatches to check',\n      rulesMade,\n      accText: acc + ' %',\n      accW: acc + '%',\n      accFill: acc >= 90 ? '#26d07c' : '#fcb315',\n      accInk: acc >= 90 ? '#0c7350' : '#2c2e3a',\n      replayNote: !st.replayed ? 'Replayed at 13:40 · 26 accruals' : !rulesMade ? 'Replayed again at 15:12' : 'Replayed again at 15:12 with ' + rulesMade + ' suggested ' + (rulesMade === 1 ? 'rule' : 'rules') + (st.live ? '' : ' · not active yet'),\n      rulesNote: st.live ? (rulesMade ? 'Active from the November close' : '') : 'None is active until you approve the go-live',\n      ruleList: ruleIds.map((d) => ({ type: types[d.type].short, text: st.ruleText[d.id] !== undefined ? st.ruleText[d.id] : d.rule, bg: types[d.type].bg, ink: types[d.type].ink, status: ruleState[0], chipBg: ruleState[1], chipInk: ruleState[2] })),\n      noRules: rulesMade === 0,\n      cantReplay: left1 + left2 > 0 || st.replayed,\n      replay: () => this.setState({ replayed: true }),\n      canSend: !st.live,\n      cantSend: !ready,\n      sendLabel: rulesMade ? 'Approve go-live and ' + rulesMade + (rulesMade === 1 ? ' rule' : ' rules') : 'Approve go-live',\n      send: () => { if (ready) this.setState({ live: true }); },\n      isLive: st.live,\n      nextHint: st.live ? '' : drafting ? 'Add the rule or cancel to continue.'\n        : left1 > 0 ? 'Check ' + left1 + ' more, then step 2 opens.'\n        : left2 > 0 ? 'Check ' + left2 + ' more to unlock the replay.'\n        : (st.replayed ? 'Above the 90 % target. Approve to go live from the November close.' : 'All checked. Replay to test your rules on July to September.'),\n      hintInk: left1 + left2 > 0 && !drafting ? '#595c6a' : '#0c7350',\n      hintWeight: left1 + left2 > 0 && !drafting ? '400' : '600'\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow0-Email", "title": "Morning email", "step": 3, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Morning email\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#f8f8f8;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\na:focus-visible,button:focus-visible{outline:2px solid #1143be;outline-offset:2px}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch; background: #f8f8f8;\">\n\n\n\u003cnav aria-label=\"Mailbox\" style=\"flex: 1 1 300px; max-width: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #ececf0; display: [0] ? '#2c2e3a' : '#c5c9d3',\n      pick: () => this.setState({ filter: d[0] })\n    }));\n    filters.forEach((f, i) => { if (st.filter === defs[i][0]) f.bg = '#ececf0'; });\n    const rows = all\n      .filter((r) => st.filter === 'all' || (st.filter === 'email' ? (r.kind === 'email' || (r.kind === 'other' && r.icon === 'MAIL')) : r.kind === st.filter))\n      .map((r) => ({ ...r, hasNote: !!r.note, fade: r.results.length ? '1' : '0.7', isMail: r.icon === 'MAIL', isPdf: r.icon === 'PDF', isXls: r.icon === 'XLS', isBank: r.icon === 'BANK', isErp: r.icon === 'ERP' }));\n    const usedRows = rows.filter((r) => r.results.length);\n    const unusedRows = rows.filter((r) => !r.results.length);\n    const showUnused = st.showUnused || st.filter === 'other';\n    const trustDefs = [\n      { id: 'ask', label: 'Ask me every time', text: 'Every proposal comes to you.' },\n      { id: 'routine', label: 'Auto-approve routine items', text: 'Same supplier, within 2 % of last month. You see them afterwards in the log.' },\n      { id: 'clean', label: 'Auto-approve unless flagged', text: 'Only proposals with an exception come to you.' }\n    ];\n    const lab = (id) => trustDefs.find((d) => d.id === id).label;\n    const trustOpts = trustDefs.map((d) => ({\n      label: d.label, text: d.text, checked: st.trustDraft === d.id,\n      bg: st.trustDraft === d.id ? '#f3f7f9' : '#ffffff', edge: st.trustDraft === d.id ? '#bed3e0' : '#ececf0',\n      pick: () => this.setState({ trustDraft: d.id })\n    }));\n    return {\n      trustOpts,\n      trustNow: 'Ask me every time' + (st.trustRequested ? ' \\u00b7 \\u201c' + lab(st.trustRequested) + '\\u201d requested' : ''),\n      canRequest: st.trustDraft !== 'ask' && st.trustDraft !== st.trustRequested,\n      requestTrust: () => this.setState({ trustRequested: st.trustDraft }),\n      trustNote: st.trustRequested ? 'Sent to Tone Ruud, the Nordic process owner. Brattli stays on \\u201cAsk me every time\\u201d until the risk assessment is done and she approves.' : 'Anything beyond \\u201cAsk me every time\\u201d needs a risk assessment and approval from the Nordic process owner. Off in the first increment. Every change is logged.',\n      filters, usedRows, unusedRows, showUnused,\n      hasUsed: usedRows.length > 0, hasUnused: unusedRows.length > 0 && st.filter !== 'other',\n      unusedExpanded: showUnused ? 'true' : 'false',\n      unusedLabel: (showUnused ? 'Hide ' : 'Show ') + unusedRows.length + ' not used',\n      unusedToggle: () => this.setState({ showUnused: !st.showUnused }),\n      reminded: st.reminded, notReminded: !st.reminded,\n      remind: () => this.setState({ reminded: true })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow3-Review", "title": "Proposal review", "step": 4, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Proposal review\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton,input,select,textarea{font-family:inherit}\nbutton{cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:0.45}\nbutton:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #1143be;outline-offset:2px}\nkbd{font-family:inherit;font-size:13px;line-height:16px;font-weight:600;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:0.7}\nsummary::-webkit-details-marker{display:none}\nsummary::marker{content:\"\"}\n@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(38,208,124,0.55)}70%{box-shadow:0 0 0 8px rgba(38,208,124,0)}100%{box-shadow:0 0 0 0 rgba(38,208,124,0)}}\n.live{animation:livepulse 1.6s infinite}\n@media (prefers-reduced-motion: reduce){.live{animation:none}}\n\u003c/style>\n\u003c/helmet>\ tyle=\"margin: 0; font-size: 17px; line-height: 26px; color: #595c6a;\">Explain what you want. The agent writes the rule and tests it.\u003c/p>\n\u003c/div>\n\u003ca href=\"Flow3-Review.dc.html\" style=\"color: #2c2e3a; font-size: 15px; font-weight: 600;\">Keep it to this booking only\u003c/a>\n\u003c/div>\n\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;\">\n\n\u003cdiv style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px;\">\n\u003csection aria-label=\"Your fix\" style=\"border: 1px solid #dadce2; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;\">\n\u003cspan style=\"font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #595c6a;\">Your fix · today 10:21\u003c/span>\n\u003cstrong style=\"font-size: 17px; line-height: 24px; font-weight: 600;\">IT consulting · Kodeverket AS\u003c/strong>\n\u003cdiv style=\"display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;\">\u003cspan style=\"font-size: 20px; color: #595c6a; text-decoration: line-through; font-variant-numeric: tabular-nums;\">48 000\u003c/span>\u003cspan style=\"font-size: 32px; line-height: 40px; font-weight: 700; font-variant-numeric: tabular-nums;\">46 500 kr\u003c/span>\u003c/div>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\u003cspan style=\"font-size: 15px; font-weight: 600; background: #e9fcf1; color: #0c7350; border-radius: 999px; padding: 4px 12px;\">Customer sent a new figure\u003c/span>\u003c/div>\n\u003cp style=\"margin: 0; font-size: 15px; line-height: 22px;\">“Confirmed with Lene by phone, 2 Nov.”\u003c/p>\n\u003cdiv style=\"border-top: 1px solid #ececf0; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 21px; font-variant-numeric: tabular-nums;\">\n\u003cspan style=\"color: #595c6a;\">Same fix before\u003c/span>\n\u003cspan>September · 48 000 → 47 500\u003c/span>\n\u003cspan>August · 48 000 → 47 200\u003c/span>\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-label=\"The document\" style=\"border: 1px solid #dadce2; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;\">\n\u003cspan style=\"font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #595c6a;\">Open document\u003c/span>\n\u003cstrong style=\"font-size: 15px; font-weight: 600;\">Email · Lene Brattli · Fri 30 Oct\u003c/strong>\n\u003cp style=\"margin: 0; font-size: 15px; line-height: 24px;\">The IT consultants from Kodeverket worked through October as planned. Their invoice for \u003cmark style=\"background: #ebfaff; color: #2c2e3a; border-bottom: 2px solid #007fa9; padding: 0 2px;\">about NOK 48,000\u003c/mark> will only come in mid-November.\u003c/p>\n\u003c/section>\n\u003c/div>\n\n\u003csection aria-labelledby=\"chat-h\" style=\"flex: 2 1 600px; min-width: 0; border: 1px solid #dadce2; border-radius: 12px; display: flex; flex-direction: column;\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px 22px; border-bottom: 1px solid #ececf0;\">\n\u003cspan aria-hidden=\"true\" style=\"width: 28px; height: 28px; border-radius: 50%; background: #112034; display: flex; align-items: center; justify-content: center; flex: none;\">\u003csvg width=\"14\" height=\"12\" viewBox=\"0 0 14 12\">\u003cpolygon points=\"0,0 14,0 7,12\" fill=\"#26d07c\">\u003c/polygon>\u003c/svg>\u003c/span>\n\u003ch2 id=\"chat-h\" style=\"margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;\">Brattli agent\u003c/h2>\n\u003cspan style=\"font-size: 14px; color: #595c6a;\">Learns from this document\u003c/span>\n\u003cspan role=\"status\" style=\"margin-left: auto; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 3px 12px; background: {{stateBg}}; color: {{stateInk}};\">{{stateLabel}}\u003c/span>\n\u003c/div>\n\n\u003cdiv role=\"log\" aria-live=\"polite\" aria-label=\"Conversation with the agent\" style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px 22px;\">\n\u003csc-for list=\"{{msgs}}\" as=\"m\" hint-placeholder-count=\"3\">\n\u003cdiv style=\"display: flex; justify-content: {{m.align}};\">\n\u003cp style=\"margin: 0; max-width: 78%; font-size: 15px; line-height: 22px; padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.ink}};\">{{m.text}}\u003c/p>\n\u003c/div>\n\u003c/sc-for>\n\n\u003csc-if value=\"{{showRule}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"border: 1px solid #bed3e0; background: #f3f7f9; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px;\">\n\u003cstrong style=\"font-size: 15px; font-weight: 600;\">{{ruleTitle}}\u003c/strong>\n\u003cspan style=\"font-size: 13px; font-weight: 700; background: #f7f2ff; color: #60138a; border-radius: 999px; padding: 2px 10px;\">Analysis rule\u003c/span>\n\u003cspan style=\"font-size: 13px; font-weight: 600; background: #ffffff; color: #424553; border: 1px solid #dadce2; border-radius: 999px; padding: 1px 10px;\">Brattli only\u003c/span>\n\u003c/div>\n\u003cp style=\"margin: 0; font-size: 17px; line-height: 26px; font-weight: 600;\">{{ruleText}}\u003c/p>\n\u003ctable style=\"width: 100%; border-collapse: collapse; font-size: 15px; line-height: 20px; font-variant-numeric: tabular-nums;\">\n\u003cthead>\u003ctr>\u003cth scope=\"col\" style=\"text-align: left; font-size: 13px; font-weight: 600; color: #595c6a; padding: 0 12px 8px 0; border-bottom: 1px solid #dadce2;\">Re-run on\u003c/th>\u003cth scope=\"col\" style=\"text-align: right; font-size: 13px; font-weight: 600; color: #595c6a; padding: 0 12px 8px 0; border-bottom: 1px solid #dadce2;\">Before\u003c/th>\u003cth scope=\"col\" style=\"text-align: right; font-size: 13px; font-weight: 600; color: #595c6a; padding: 0 12px 8px 0; border-bottom: 1px solid #dadce2;\">With the rule\u003c/th>\u003cth scope=\"col\" style=\"text-align: right; font-size: 13px; font-weight: 600; color: #595c6a; padding: 0 0 8px 0; border-bottom: 1px solid #dadce2;\">Booked\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd style=\"padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2;\">This email · October\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2; color: #595c6a;\">48 000\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2; font-weight: 600;\">46 500\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 0; border-bottom: 1px solid #dadce2; color: #0c7350; font-weight: 600;\">46 500 ✓\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2;\">September\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2; color: #595c6a;\">48 000\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; border-bottom: 1px solid #dadce2; font-weight: 600;\">47 500\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 0; border-bottom: 1px solid #dadce2; color: #0c7350; font-weight: 600;\">47 500 ✓\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding: 10px 12px 10px 0;\">August\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; color: #595c6a;\">48 000\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 12px 10px 0; font-weight: 600;\">47 200\u003c/td>\u003ctd style=\"text-align: right; padding: 10px 0; color: #0c7350; font-weight: 600;\">47 200 ✓\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003csc-if value=\"{{canSave}}\" hint-placeholder-val=\"{{ true }}\">\n\u003cspan style=\"font-size: 15px; line-height: 22px;\">{{advice}}\u003c/span>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px;\">\n\u003cbutton type=\"button\" onClick=\"{{savePrimary}}\" style=\"background: #26d07c; color: #2c2e3a; border: 0; border-radius: 999px; padding: 0 22px; min-height: 48px; font-size: 15px; font-weight: 700;\">{{primaryLabel}}\u003c/button>\n\u003cbutton type=\"button\" onClick=\"{{saveSecondary}}\" style=\"background: #ffffff; color: #2c2e3a; border: 1px solid #c5c9d3; border-radius: 999px; padding: 0 18px; min-height: 48px; font-size: 15px; font-weight: 600;\">{{secondaryLabel}}\u003c/button>\n\u003cbutton type=\"button\" onClick=\"{{changeIt}}\" style=\"background: transparent; color: #2c2e3a; border: 0; padding: 0 8px; min-height: 48px; font-size: 15px; font-weight: 600; text-decoration: underline;\">Change something\u003c/button>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isSent}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; border-top: 1px solid #bed3e0; padding-top: 14px;\">\n\u003cspan style=\"font-size: 15px; line-height: 22px;\">\u003cstrong style=\"font-weight: 600;\">With Karin Aas\u003c/strong> \u003cspan style=\"color: #595c6a;\">· she set up Brattli and sees these results\u003c/span>\u003c/span>\n\u003cbutton type=\"button\" onClick=\"{{approveAsKarin}}\" style=\"margin-left: auto; background: #1143be; color: #ffffff; border: 0; border-radius: 999px; padding: 0 20px; min-height: 44px; font-size: 15px; font-weight: 700;\">Demo: approve as Karin\u003c/button>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{isApproved}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; border-top: 1px solid #bed3e0; padding-top: 14px; color: #0c7350;\">\n\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M3.5 9.5l3.5 3.5 7.5-8\">\u003c/path>\u003c/svg>\n\u003cspan style=\"font-size: 15px; line-height: 22px;\">\u003cstrong style=\"font-weight: 700;\">{{approvedText}}\u003c/strong> · active from the November close\u003c/span>\n\u003ca href=\"Flow3-Review.dc.html\" style=\"margin-left: auto; color: #2c2e3a; font-size: 15px; font-weight: 700; text-decoration: none; border: 1px solid #c5c9d3; border-radius: 999px; padding: 10px 18px;\">Back to review\u003c/a>\n\u003cbutton type=\"button\" onClick=\"{{reset}}\" style=\"background: transparent; border: 0; color: #2c2e3a; font-size: 15px; font-weight: 600; text-decoration: underline; min-height: 44px;\">Reset demo\u003c/button>\n\u003c/div>\n\u003c/sc-if>\n\u003c/div>\n\u003c/sc-if>\n\u003csc-for list=\"{{afterMsgs}}\" as=\"m\" hint-placeholder-count=\"0\">\n\u003cdiv style=\"display: flex; justify-content: flex-start;\">\n\u003cp style=\"margin: 0; max-width: 78%; font-size: 15px; line-height: 22px; padding: 10px 14px; border-radius: 4px 14px 14px 14px; background: #f8f8f8; color: #2c2e3a;\">{{m.text}}\u003c/p>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\n\u003csc-if value=\"{{canReply}}\" hint-placeholder-val=\"{{ true }}\">\n\u003cdiv style=\"border-top: 1px solid #ececf0; padding: 14px 22px 18px; display: flex; flex-direction: column; gap: 10px;\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n\u003csc-for list=\"{{replies}}\" as=\"r\" hint-placeholder-count=\"2\">\n\u003cbutton type=\"button\" onClick=\"{{r.pick}}\" style=\"background: #ffffff; color: #2c2e3a; border: 1px solid #c5c9d3; border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 500; text-align: left;\">{{r.label}}\u003c/button>\n\u003c/sc-for>\n\u003c/div>\n\u003cdiv style=\"display: flex; gap: 8px; align-items: center;\">\n\u003clabel style=\"flex: 1; display: flex;\">\u003cspan style=\"position: absolute; left: -9999px;\">Message the agent\u003c/span>\u003cinput type=\"text\" value=\"{{draft}}\" onChange=\"{{setDraft}}\" placeholder=\"Or write it in your own words\" style=\"box-sizing: border-box; width: 100%; min-height: 44px; border: 1px solid #c5c9d3; border-radius: 999px; padding: 0 16px; font-size: 15px; font-family: inherit; color: #2c2e3a;\">\u003c/label>\n\u003cbutton type=\"button\" onClick=\"{{sendDraft}}\" disabled=\"{{cantSend}}\" style=\"background: #2c2e3a; color: #ffffff; border: 0; border-radius: 999px; padding: 0 20px; min-height: 44px; font-size: 15px; font-weight: 700; opacity: {{sendOpacity}};\">Send\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\u003c/section>\n\u003c/div>\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1150}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { step: 0, answers: [], draft: '', saved: null, approved: false };\n  }\n  renderVals() {\n    const st = this.state;\n    const scopeAll = st.answers[1] === 'All IT services at Brattli';\n    const fallbackAsk = st.answers[2] === 'Leave it out and tell me';\n    const agentLines = [\n      'You changed Kodeverket from 48 000 to 46 500 because Lene confirmed a new figure. You did the same in August and September. What should I do differently next time?',\n      'Got it. Only for Kodeverket, or for all IT services at Brattli?',\n      'And if Lene hasn’t replied by the 3rd working day?',\n      'Here’s the rule. I re-ran it on this email and on August and September:'\n    ];\n    const replySets = [\n      ['Ask Lene for the final figure before you draft it'],\n      ['Only Kodeverket', 'All IT services at Brattli'],\n      ['Use her estimate and send it to review', 'Leave it out and tell me']\n    ];\n    const msgs = [];\n    const agent = (text) => msgs.push({ text, align: 'flex-start', bg: '#f8f8f8', ink: '#2c2e3a', radius: '4px 14px 14px 14px' });\n    const you = (text) => msgs.push({ text, align: 'flex-end', bg: '#112034', ink: '#ffffff', radius: '14px 4px 14px 14px' });\n    for (let i = 0; i \u003c= Math.min(st.step, 3); i++) {\n      agent(agentLines[i]);\n      if (i \u003c st.step && st.answers[i]) you(st.answers[i]);\n    }\n    const ruleId = st.saved === 'update' ? 'C-04' : 'C-05';\n    const afterMsgs = [];\n    if (st.saved) afterMsgs.push({ text: st.saved === 'update'\n      ? 'Saved as an update to C-04. Karin Aas set up Brattli, so she approves it with these results. Until then nothing changes for new documents.'\n      : 'Saved as new rule C-05. It overrides C-04 for Kodeverket. Karin Aas set up Brattli, so she approves it with these results. Until then nothing changes for new documents.' });\n    if (st.approved) afterMsgs.push({ text: 'Karin Aas approved ' + ruleId + '. I’ll use it from the November close.' });\n\n    const target = scopeAll ? 'IT services' : 'Kodeverket';\n    const fallback = fallbackAsk ? 'leave it out and tell the consultant' : 'use her estimate and send it to review';\n    const ruleText = 'Before drafting the ' + target + ' accrual, ask Lene to confirm the final figure and accrue what she confirms. If she hasn’t replied by the 3rd working day, ' + fallback + '.';\n    const recommendUpdate = scopeAll;\n    const answer = (text) => {\n      if (!text || st.step > 2) return;\n      const answers = st.answers.slice(0, st.step).concat([text]);\n      this.setState({ answers, step: st.step + 1, draft: '' });\n    };\n    const save = (kind) => this.setState({ saved: kind });\n    const stateLabel = st.approved ? 'Active · Nov close' : (st.saved ? 'With Karin' : (st.step >= 3 ? 'Draft rule' : 'Teaching'));\n    const stateColors = st.approved ? ['#e9fcf1', '#0c7350'] : (st.saved ? ['#fff3d3', '#6c4900'] : ['#ececf0', '#424553']);\n    return {\n      msgs, afterMsgs,\n      replies: (replySets[st.step] || []).map((label) => ({ label, pick: () => answer(label) })),\n      canReply: st.step \u003c= 2,\n      draft: st.draft,\n      setDraft: (e) => this.setState({ draft: e.target.value }),\n      sendDraft: () => answer((st.draft || '').trim()),\n      cantSend: !(st.draft || '').trim(),\n      sendOpacity: (st.draft || '').trim() ? '1' : '0.45',\n      showRule: st.step >= 3,\n      ruleTitle: st.saved ? (st.saved === 'update' ? 'Rule C-04 · updated' : 'Rule C-05') : 'New rule',\n      ruleText,\n      canSave: st.step >= 3 && !st.saved,\n      advice: recommendUpdate\n        ? 'This changes how C-04 works for all IT services, so I suggest updating C-04.'\n        : 'C-04 covers all IT services at Brattli. This is only for Kodeverket, so I suggest a new rule that overrides C-04 for Kodeverket.',\n      primaryLabel: recommendUpdate ? 'Update C-04' : 'Save as new rule',\n      secondaryLabel: recommendUpdate ? 'Save as new rule' : 'Update C-04 instead',\n      savePrimary: () => save(recommendUpdate ? 'update' : 'new'),\n      saveSecondary: () => save(recommendUpdate ? 'new' : 'update'),\n      changeIt: () => this.setState({ step: 1, answers: st.answers.slice(0, 1), saved: null }),\n      isSent: !!st.saved && !st.approved,\n      isApproved: st.approved,\n      approvedText: 'Karin Aas approved ' + (st.saved === 'update' ? 'C-04' : 'C-05'),\n      approveAsKarin: () => this.setState({ approved: true }),\n      reset: () => this.setState({ step: 0, answers: [], draft: '', saved: null, approved: false }),\n      stateLabel, stateBg: stateColors[0], stateInk: stateColors[1]\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow5-SignOff", "title": "Sign-off", "step": 5, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Sign-off\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton,input{font-family:inherit}\nbutt dDefs.map((r) => ({\n      ...r, amount: this.nok(r.value), canSend: !st.back[r.id] && st.stage !== 'posted', isBack: !!st.back[r.id], fade: st.back[r.id] ? '0.6' : '1',\n      sendBack: () => this.setState({ back: { ...st.back, [r.id]: true } }),\n      isOpen: !!st.open[r.id], expanded: st.open[r.id] ? 'true' : 'false', openLabel: st.open[r.id] ? 'Close' : 'Open',\n      toggle: () => this.setState({ open: { ...st.open, [r.id]: !st.open[r.id] } })\n    }));\n    const reviewed = [\n      { title: 'Pipes and fittings · Rørgrossisten Vest AS', detail: '', amount: '22 400' },\n      { title: 'Van fuel · Fjordtank AS', detail: '', amount: '11 500' },\n      { title: 'Waste containers · Vestland Renovasjon AS', detail: '', amount: '7 150' },\n      { title: 'Excavator rental · Vestland Maskinutleie AS', detail: '', amount: '18 500' }\n    ];\n    const auto = [\n      { name: 'Mobile · Fjordtel AS', amount: '3 480' }, { name: 'Accounting software · Regnskapsskyen', amount: '1 250' },\n      { name: 'Van leasing · Vestlandsleasing AS', amount: '18 900' }, { name: 'Office cleaning · Renhold Bergen', amount: '4 100' },\n      { name: 'Tool rental · Verktøyutleie Vest', amount: '2 650' }, { name: 'Workwear laundry · Tekstilservice', amount: '1 890' }\n    ];\n    let total = 162320;\n    let count = 12;\n    flaggedDefs.forEach((r) => { if (st.back[r.id]) { total -= r.value; count -= 1; } });\n    return {\n      flagged, reviewed, auto,\n      showAuto: st.showAuto,\n      autoExpanded: st.showAuto ? 'true' : 'false',\n      autoLabel: st.showAuto ? 'hide' : 'show',\n      toggleAuto: () => this.setState({ showAuto: !st.showAuto }),\n      count, totalText: this.nok(total),\n      lastVoucher: 'BR-2026-10-' + (100 + count),\n      hasBack: Object.keys(st.back).length > 0,\n      s: { idle: st.stage === 'idle', confirm: st.stage === 'confirm', posted: st.stage === 'posted' },\n      ask: () => this.setState({ stage: 'confirm' }),\n      cancel: () => this.setState({ stage: 'idle' }),\n      post: () => this.setState({ stage: 'posted' })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow5b-Posting", "title": "Post to the Customer ERP", "step": 5, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Post to the Customer ERP\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton{cursor:pointer;font-family:inherit}\nbutton:disabled{cursor:not-allowed}\na:focus-visible,button:focus-visible{outline:2px solid #1143be;outline-offset:2px}\nsummary::-webkit-details-marker{display:none}\nsummary::marker{content:\"\"}\n@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(38,208,124,0.55)}70%{box-shadow:0 0 0 8px rgba(38,208,124,0)}100%{box-shadow:0 0 0 0 rgba(38,208,124,0)}}\n.live{animation:livepulse 1.6s infinite}\n@media (prefers-reduced-motion: reduce){.live{animation:none}}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"display: flex; flex-direction: column; min-height: 100vh;\">\n\n\n\u003cheader style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 32px; border-bottom: 1px solid #ececf0;\">\n\u003ca href=\"Flow5b-Posting.dc.html\" aria-label=\"Azets, Posting\" style=\"display: flex;\">\u003cimg src=\"%%LOGO%%\" alt=\"Azets\" style=\"height: 20px; width: auto;\">\u003c/a>\n\u003cnav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 4px;\">\n\u003ca href=\"Flow5-SignOff.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: #2c2e3a; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: transparent;\">Sign-off\u003cspan style=\"font-size: 13px; line-height: 18px; font-weight: type=\"button\" onClick=\"{{openDraft}}\" style=\"align-self: flex-start; border: 1px solid #c5c9d3; background: #ffffff; color: #2c2e3a; border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 600;\">Review the draft\u003c/button>\n\u003c/sc-if>\n\u003c/sc-if>\n\u003c/section>\n\u003c/sc-if>\n\u003c/aside>\n\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1500}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { stage: 0, fixed: false, draft: false, sent: false };\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    const st = this.state;\n    const stage = st.stage;\n    const returned = stage >= 5 && !st.fixed;\n    const done = stage >= 5 && st.fixed;\n    const defs = [\n      { label: 'Sent', sub: '' },\n      { label: 'Received', sub: '' },\n      { label: 'Checked', sub: 'Period, accounts, balance' },\n      { label: 'Posted', sub: '' },\n      { label: 'Confirmed', sub: returned ? '11 of 12' : '' }\n    ];\n    const stages = defs.map((d, i) => {\n      const isDone = i \u003c stage && !(i === 4 && returned);\n      const isNow = (stage > 0 && i === stage && stage \u003c 5) || (i === 4 && returned);\n      return { ...d, done: isDone, now: isNow, bar: isDone ? '#0c7350' : (isNow ? '#26d07c' : '#ececf0'), ink: isDone || isNow ? '#2c2e3a' : '#595c6a', weight: isDone || isNow ? '600' : '500' };\n    });\n    const rows = [\n      ['Pipes and fittings · Rørgrossisten Vest AS', '4000 Purchases', '22 400'],\n      ['Van fuel · Fjordtank AS', '7000 Fuel', '11 500'],\n      ['IT consulting · Kodeverket AS', '6790 Other external services', '46 500'],\n      ['Payment 28 Oct · Kodeverket AS', '1700 Prepaid expenses', '24 000'],\n      ['Waste containers · Vestland Renovasjon AS', '6390 Waste', '7 150'],\n      ['Excavator rental · Vestland Maskinutleie AS', '6400 Machine rental', '18 500'],\n      ['Mobile · Fjordtel AS', '6900 Telephone', '3 480'],\n      ['Accounting software · Regnskapsskyen', '6540 Software', '1 250'],\n      ['Van leasing · Vestlandsleasing AS', st.fixed ? '6350 Vehicle leasing' : '6340 Leasing', '18 900'],\n      ['Office cleaning · Renhold Bergen', '6360 Cleaning', '4 100'],\n      ['Tool rental · Verktøyutleie Vest', '6420 Equipment rental', '2 650'],\n      ['Workwear laundry · Tekstilservice', '6390 Other costs', '1 890']\n    ];\n    const vouchers = rows.map((r, i) => {\n      const isLease = i === 8;\n      let s = ['Ready', '#ececf0', '#424553'];\n      if (stage > 0 && stage \u003c 5) s = ['Sending', '#ebfaff', '#00597a'];\n      if (stage >= 5) s = (isLease && !st.fixed) ? ['Came back · account closed', '#fdeadd', '#2c2e3a'] : ['Confirmed', '#e9fcf1', '#0c7350'];\n      return { name: r[0], acct: r[1], amount: r[2], no: stage >= 4 && !(isLease && !st.fixed) ? 'BR-2026-10-' + (101 + i) : '·', status: s[0], tagBg: s[1], tagInk: s[2] };\n    });\n    const confirmed = stage >= 5 ? (st.fixed ? 12 : 11) : 0;\n    return {\n      stages, vouchers,\n      canSend: stage === 0,\n      showReturn: returned,\n      done, notDone: !done,\n      progTitle: stage === 0 ? 'Ready to send' : (done ? 'Posted and confirmed' : (returned ? '11 posted, 1 needs you' : 'Sending to the Customer ERP')),\n      confirmedText: stage === 0 ? '12 ready' : confirmed + ' of 12 confirmed',\n      send: () => {\n        this.setState({ stage: 1 });\n        clearInterval(this.timer);\n        this.timer = setInterval(() => {\n          const next = this.state.stage + 1;\n          this.setState({ stage: next });\n          if (next >= 5) clearInterval(this.timer);\n        }, 700);\n      },\n      fix: () => this.setState({ fixed: true }),\n      mailSent: st.sent, mailOpen: !st.sent,\n      mailState: st.sent ? 'Sent just now' : 'Draft ready',\n      showDraft: st.draft, hideDraft: !st.draft,\n      openDraft: () => this.setState({ draft: true }),\n      sendMail: () => this.setState({ sent: true })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow6-Trace", "title": "Booked and traced", "step": 5, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Booked and traced\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton,input{font-family:inherit}\nbutton{cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:0.45}\na:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #1143be;outline-offset:2px}\nsummary::-webkit-details-marker{display:none}\nsummary::marker{content:\"\"}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"display: flex; flex-direction: column; min-height: 100vh;\">\n\n\n\u003cheader style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 32px; border-bottom: 1px solid #ececf0;\">\n\u003ca href=\"Flow5-SignOff.dc.html\" aria-label=\"Azets, Sign-off\" style=\"display: flex;\">\u003cimg src=\"%%LOGO%%\" alt=\"Azets\" style=\"height: 20px; width: auto;\">\u003c/a>\n\u003cnav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 4px;\">\n\u003ca href=\"Flow5-SignOff.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: #2c2e3a; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: transparent;\">Sign-off\u003cspan style=\"font-size: 13px; line-height: 18px; font-weight: 700; background: #ececf0; color: #2c2e3a; border-radius: 999px; padding: 0 7px;\">12\u003c/span>\u003c/a>\n\u003ca href=\"Flow6-Trace.dc.html\" aria-current=\"page\" style=\"display: inline-flex; align-items: center; gap: 8px; font-s n', 'Erik Haugen · reviewer', 'Reversed the booking as BR-2026-10-113 and cancelled BR-2026-11-003', 'Reason: ' + st.reason, '']);\n    const rows = st.showAgent\n      ? raw.map((r, i) => r.concat([i === 1]))\n      : [raw[0].concat([false]), ['13:42–13:44', 'agent', 'Agent · read, checked and drafted', 'Read, checked and drafted 48 000 kr for review', 'Rules GL-01, GR-03, C-04', '', true]].concat(raw.slice(5).map((r) => r.concat([false])));\n    const toggleAgent = () => this.setState({ showAgent: !st.showAgent });\n    const steps = rows.map((r, i) => ({\n      when: r[0], dot: C[r[1]], actor: r[2], what: r[3], detail: r[4], hasDetail: !!r[4], quote: r[5], hasQuote: !!r[5],\n      hasToggle: r[6], toggle: toggleAgent, toggleLabel: st.showAgent ? 'Hide the agent’s steps' : 'Show all 4 agent steps',\n      lineTop: i === 0 ? 'transparent' : '#dadce2', lineBottom: i === rows.length - 1 ? 'transparent' : '#dadce2'\n    }));\n    return {\n      steps,\n      statusLabel: st.reversed ? 'Reversed' : 'Posted · reverses 1 Nov',\n      statusBg: st.reversed ? '#fdeadd' : '#e9fcf1',\n      statusInk: st.reversed ? '#8a3800' : '#0c7350',\n      exportLabel: st.exported ? 'Exported as PDF and CSV' : 'Export trail',\n      exportTrail: () => this.setState({ exported: true }),\n      reversing: st.mode === 'reverse',\n      cantReverse: st.reversed,\n      openReverse: () => this.setState({ mode: 'reverse' }),\n      cancel: () => this.setState({ mode: 'idle' }),\n      reason: st.reason,\n      setReason: (e) => this.setState({ reason: e.target.value }),\n      noReason: !String(st.reason).trim(),\n      reverse: () => this.setState({ reversed: true, mode: 'idle' })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow7-TeamLead", "title": "Team lead view", "step": 0, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Team lead view\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/scrip : 26px; font-weight: 600;\">Where the agents need people\u003c/h2>\n\u003cspan style=\"font-size: 15px; color: #595c6a;\">Share of proposals accepted without a change, by material\u003c/span>\n\u003csc-for list=\"{{sources}}\" as=\"s\" hint-placeholder-count=\"5\">\n\u003cdiv style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 15px;\">\n\u003cspan>{{s.name}}\u003c/span>\n\u003cspan style=\"height: 8px; background: #ececf0; border-radius: 999px; overflow: hidden;\">\u003cspan style=\"display: block; height: 100%; width: {{s.w}}; background: {{s.fill}}; border-radius: 999px;\">\u003c/span>\u003c/span>\n\u003cstrong style=\"text-align: right; font-weight: 600; font-variant-numeric: tabular-nums;\">{{s.pct}}\u003c/strong>\n\u003c/div>\n\u003c/sc-for>\n\u003cspan style=\"font-size: 15px; line-height: 20px; color: #595c6a;\">Bank lines without an invoice are hardest. Most become a question to the customer.\u003c/span>\n\u003c/section>\n\n\u003csection aria-labelledby=\"fx-h\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid #dadce2; border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;\">\n\u003ch2 id=\"fx-h\" style=\"margin: 0; font-size: 20px; line-height: 26px; font-weight: 600;\">Why consultants changed or rejected proposals\u003c/h2>\n\u003cspan style=\"font-size: 15px; color: #595c6a;\">58 this close\u003c/span>\n\u003cul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px;\">\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ececf0;\">\u003cspan>Wrong amount\u003c/span>\u003cstrong style=\"font-weight: 600;\">18\u003c/strong>\u003c/li>\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ececf0;\">\u003cspan>Customer sent a new figure\u003c/span>\u003cstrong style=\"font-weight: 600;\">6\u003c/strong>\u003c/li>\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ececf0;\">\u003cspan>Already booked\u003c/span>\u003cstrong style=\"font-weight: 600;\">11\u003c/strong>\u003c/li>\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ececf0;\">\u003cspan>Wrong account\u003c/span>\u003cstrong style=\"font-weight: 600;\">9\u003c/strong>\u003c/li>\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ececf0;\">\u003cspan>Wrong period\u003c/span>\u003cstrong style=\"font-weight: 600;\">8\u003c/strong>\u003c/li>\n\u003cli style=\"display: flex; justify-content: space-between; gap: 12px;\">\u003cspan>Not an accrual\u003c/span>\u003cstrong style=\"font-weight: 600;\">6\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003c/div>\n\n\u003csection aria-labelledby=\"wait-h\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n\u003ch2 id=\"wait-h\" style=\"margin: 0; font-size: 24px; line-height: 28px; font-weight: 600;\">Waiting for you\u003c/h2>\n\u003csc-for list=\"{{waiting}}\" as=\"w\" hint-placeholder-count=\"3\">\n\u003cdiv style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; border: 1px solid {{w.edge}}; background: {{w.bg}}; border-radius: 12px; padding: 16px 20px;\">\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n\u003cspan style=\"font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #595c6a;\">{{w.kind}} · {{w.from}}\u003c/span>\n\u003cstrong style=\"font-size: 17px; line-height: 24px; font-weight: 600;\">{{w.text}}\u003c/strong>\n\u003cspan style=\"font-size: 15px; color: #595c6a;\">{{w.sub}}\u003c/span>\n\u003c/div>\n\u003cdiv style=\"display: flex; gap: 8px; align-items: center;\">\n\u003csc-if value=\"{{w.open}}\" hint-placeholder-val=\"{{ true }}\">\n\u003ca href=\"{{w.href}}\" style=\"text-decoration: none; color: #2c2e3a; border: 1px solid #c5c9d3; border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 600;\">Details\u003c/a>\n\u003cbutton type=\"button\" onClick=\"{{w.approve}}\" style=\"border: 0; background: #26d07c; color: #2c2e3a; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 700;\">{{w.cta}}\u003c/button>\n\u003c/sc-if>\n\u003csc-if value=\"{{w.done}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cspan style=\"font-size: 15px; font-weight: 600; color: #0c7350;\">{{w.doneText}}\u003c/span>\n\u003c/sc-if>\n\u003c/div>\n\u003c/div>\n\u003c/sc-for>\n\u003c/section>\n\u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1500}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { done: {} };\n  }\n  renderVals() {\n    const st = this.state;\n    const tag = (t) => ({ ok: ['On track', '#e9fcf1', '#0c7350'], watch: ['Watch', '#fff3d3', '#6c4900'], risk: ['At risk', '#fdeadd', '#8a3800'] })[t];\n    const person = (name, sub, posted, rev, needs, missing, t) => {\n      const g = tag(t);\n      return { name, sub, posted, rev, needs, missing, label: posted + ' posted, ' + rev + ' with reviewer, ' + needs + ' to review, ' + missing + ' missing', tag: g[0], tagBg: g[1], tagInk: g[2] };\n    };\n    const people = [\n      person('Kari Nilsen', '6 customers · Brattli in review', 22, 16, 16, 2, 'ok'),\n      person('Jonas Berg', '5 customers', 31, 12, 6, 0, 'ok'),\n      person('Sofie Lie', '6 customers', 18, 20, 14, 1, 'watch'),\n      person('Amir Haddad', '4 customers · Fjordline Bakeri onboarding', 9, 6, 11, 5, 'risk')\n    ];\n    const bar = (name, pct) => ({ name, pct: pct + ' %', w: pct + '%', fill: pct >= 85 ? '#26d07c' : pct >= 65 ? '#fcb315' : '#c34f00' });\n    const sources = [bar('Delivery notes', 94), bar('Fuel and card statements', 88), bar('Customer emails', 71), bar('Excel schedules', 64), bar('Bank lines', 48)];\n    const defs = [\n      { id: 'c05', kind: 'Rule', from: 'Kari Nilsen', text: 'Brattli · ask Lene to confirm Kodeverket’s figure before drafting', sub: 'Would have matched the invoice in August and September', href: 'Flow4-FixTeach.dc.html', cta: 'Approve', doneText: 'Approved as C-05' },\n      { id: 'nv', kind: 'Rule', from: 'Jonas Berg', text: 'Nordvik Logistikk · use the 3-month average for freight when no estimate is sent', sub: 'Replay: within 3 % in 5 of the last 6 closes', href: 'Flow4-FixTeach.dc.html', cta: 'Approve', doneText: 'Approved as C-11' },\n      { id: 'tr', kind: 'Trust request', from: 'Sofie Lie', text: 'Havbris Sjømat · auto-approve routine items', sub: '98 % of routine items accepted unchanged over 3 closes · needs a risk assessment and Tone Ruud’s approval', href: 'Flow9-PilotResults.dc.html', cta: 'Support', doneText: 'Sent to Tone Ruud' }\n    ];\n    const waiting = defs.map((d) => ({\n      ...d, open: !st.done[d.id], done: !!st.done[d.id],\n      bg: st.done[d.id] ? '#f8f8f8' : '#ffffff', edge: st.done[d.id] ? '#ececf0' : '#dadce2',\n      approve: () => this.setState({ done: { ...st.done, [d.id]: true } })\n    }));\n    return { people, sources, waiting };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "Flow9-PilotResults", "title": "Pilot results", "step": 0, "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Pilot results\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0;background:#ffffff;font-family:Calibre, Arial, Helvetica, sans-serif;color:#2c2e3a;-webkit-font-smoothing:antialiased}\na{color:#2962ff}a:hover{color:#1143be}\nbutton{cursor:pointer;font-family:inheri
